services:
  orders:
    image: observability-services:dev
    build:
      context: ./services
      dockerfile: Dockerfile
    command: ["uvicorn", "orders.main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    ports:
      - "${ORDERS_PORT:-8001}:8001"
    environment:
      OTEL_SERVICE_NAME: orders
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}

  gateway:
    image: observability-services:dev
    build:
      context: ./services
      dockerfile: Dockerfile
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      OTEL_SERVICE_NAME: gateway
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ORDERS_URL: http://orders:8001
    depends_on:
      - orders

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
      - orders

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
