# Tool configuration only. Dependencies live in the requirements files.
# Tests import the services as top-level packages, so `services/` is on the path.

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services"]

[tool.ruff.lint]
# Explicit so a ruff upgrade cannot silently enable new rules.
select = ["E", "F", "I", "B", "UP"]
