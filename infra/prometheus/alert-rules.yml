groups:
  - name: service-health
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service_name) (rate(http_server_requests_total{http_response_status_code=~"5.."}[5m]))
          /
          sum by (service_name) (rate(http_server_requests_total[5m]))
          > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.service_name }}"
          description: "More than 5% of requests fail on {{ $labels.service_name }}."

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency above 2s on {{ $labels.service_name }}"
          description: "99th percentile latency is {{ $value }}s on {{ $labels.service_name }}."

      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 30s."
